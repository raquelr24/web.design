<!DOCTYPE html>
<html>
    <head>
        <title>Moody the Cloud</title>
        <link rel="stylesheet" href="style.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
        <section class="container">
            <h1 class="instructions">This is Moody. Resize the browser to change his mood -- best experienced on a larger screen.</h1>
            <div class="cloud">
                <p class="name">Moody</p>
            </div>
            <div class="captions">
            <p class="large">Look at all this space. I'm joyful.</p>
            <p class="medium">Huh, what happened to my space? I'm confused.</p>
            <p class="small">Uh oh! There's no more space. I'm scared.</p>
            </div>
        </section>

    </body>
   
</html>
